# ============================================================
# Production Docker Compose - Remyza / Chesera Backend
# Used on EC2. PostgreSQL and S3 are AWS-managed (not here).
# ============================================================
services:
  redis:
    image: redis:7-alpine
    container_name: cheshara_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ${DOCKER_IMAGE:-remyza-backend}:${IMAGE_TAG:-latest}
    container_name: cheshara_backend
    restart: always
    env_file:
      - path: .env
        format: raw
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ${DOCKER_IMAGE:-remyza-backend}:${IMAGE_TAG:-latest}
    container_name: cheshara_worker
    restart: always
    env_file:
      - path: .env
        format: raw
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A cheshara_config worker --loglevel=info --queues=sentdm,celery
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  beat:
    image: ${DOCKER_IMAGE:-remyza-backend}:${IMAGE_TAG:-latest}
    container_name: cheshara_beat
    restart: always
    env_file:
      - path: .env
        format: raw
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A cheshara_config beat --loglevel=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: ${DASHBOARD_DOCKER_IMAGE:-remyza-dashboard}:${DASHBOARD_IMAGE_TAG:-latest}
    container_name: cheshara_dashboard
    restart: always
    environment:
      API_BASE_URL: http://backend:8005/api/v1
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
